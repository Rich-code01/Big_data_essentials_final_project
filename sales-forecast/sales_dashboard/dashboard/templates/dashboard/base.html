<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sales Forecast Dashboard{% endblock %}</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-light: #273449;
            --border: #334155;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --accent-2: #34d399;
            --danger: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        nav {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        nav .brand {
            font-weight: 700;
            font-size: 1.1rem;
            margin-right: 24px;
            color: var(--accent);
        }
        nav a {
            color: var(--text-dim);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        nav a:hover { color: var(--text); background: var(--panel-light); }
        nav a.active { color: var(--bg); background: var(--accent); font-weight: 600; }
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px;
        }
        h1 { font-size: 1.6rem; margin-bottom: 4px; }
        .subtitle { color: var(--text-dim); margin-bottom: 28px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px 24px;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .kpi-label { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 6px; }
        .kpi-value { font-size: 1.5rem; font-weight: 700; }
        .kpi-value.positive { color: var(--accent-2); }
        .kpi-value.negative { color: var(--danger); }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }
        th, td {
            text-align: left;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--text-dim); font-weight: 600; font-size: 0.82rem; text-transform: uppercase; }
        tr:hover { background: var(--panel-light); }
        .pagination { margin-top: 20px; display: flex; gap: 8px; }
        .pagination a, .pagination span {
            padding: 6px 12px; border-radius: 6px; text-decoration: none;
            color: var(--text-dim); border: 1px solid var(--border); font-size: 0.85rem;
        }
        .pagination a:hover { color: var(--text); border-color: var(--accent); }
        .pagination .current { background: var(--accent); color: var(--bg); font-weight: 600; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.78rem; }
        .tag.weekend { background: rgba(56,189,248,0.15); color: var(--accent); }
        .tag.holiday { background: rgba(52,211,153,0.15); color: var(--accent-2); }
        .empty-state { color: var(--text-dim); padding: 40px; text-align: center; }
        .live-dot {
            display: inline-block; width: 9px; height: 9px; border-radius: 50%;
            background: var(--accent-2); margin-right: 8px;
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.6); }
            70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); }
            100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
        }
    </style>
</head>
<body>
    <nav>
        <span class="brand">Sales Forecast</span>
        <a href="{% url 'overview' %}" class="{% if request.resolver_match.url_name == 'overview' %}active{% endif %}">Overview</a>
        <a href="{% url 'predictions' %}" class="{% if request.resolver_match.url_name == 'predictions' %}active{% endif %}">Predictions</a>
        <a href="{% url 'charts' %}" class="{% if request.resolver_match.url_name == 'charts' %}active{% endif %}">Charts</a>
        <a href="{% url 'live' %}" class="{% if request.resolver_match.url_name == 'live' %}active{% endif %}">Live</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
